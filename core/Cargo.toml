[workspace]
members = [".", "bindgen"]
default-members = ["."]

[package]
name = "obscura-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "obscura_core"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = ["sqlcipher-openssl"]
# SQLCipher's crypto provider: enable exactly one. Vendored OpenSSL builds for every target.
sqlcipher-openssl = ["rusqlite/bundled-sqlcipher-vendored-openssl"]
# Apple targets only: without OpenSSL, libsqlite3-sys builds SQLCipher against CommonCrypto
# (and links Security.framework) when both host and target are Apple.
sqlcipher-commoncrypto = ["rusqlite/bundled-sqlcipher"]

[dependencies]
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.106.2" }
rusqlite = "0.43.0"
uniffi = { version = "0.32.2", features = ["tokio"] }
thiserror = "2.0.21"
futures = { version = "0.3.34", default-features = false, features = ["executor", "alloc"] }
async-trait = "0.1.79"
rand = "0.9.4"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util = "0.7.20"
prost = "0.14.6"
aes-gcm = "0.11.1"
hkdf = "0.13.0"
sha2 = "0.11.1"
subtle = "2.6.1"
uuid = { version = "1.29.2", features = ["v4"] }
base64 = "0.23.1"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"

[build-dependencies]
prost-build = "0.14.6"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true

[profile.release.package.curve25519-dalek]
overflow-checks = false
[profile.release.package.sha2]
overflow-checks = false
[profile.release.package.hmac]
overflow-checks = false
