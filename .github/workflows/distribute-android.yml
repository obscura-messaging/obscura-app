name: Distribute Android

on:
  workflow_call:
    inputs:
      env:
        required: true
        type: string
      sha:
        required: true
        type: string
      build_number:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: android-${{ inputs.env }}
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      aab_sha256: ${{ steps.verify.outputs.aab_sha256 }}
      sha: ${{ steps.metadata.outputs.sha }}
    env:
      OBSCURA_ENV: ${{ inputs.env }}
      DISTRIBUTION_REF: ${{ inputs.sha }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      RELEASE_VERSION: ${{ inputs.version }}
      ANDROID_PACKAGE_NAME: ${{ inputs.env == 'prod' && 'dev.barrelmaker.obscura' || 'dev.barrelmaker.obscura.dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.DISTRIBUTION_REF }}
          submodules: recursive

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node: true
          java: true

      - name: Install secrets
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail

          for name in \
            GOOGLE_SERVICES_JSON_BASE64 \
            ANDROID_RELEASE_KEYSTORE_BASE64 \
            ANDROID_RELEASE_STORE_PASSWORD \
            ANDROID_RELEASE_KEY_ALIAS
          do
            [[ -n "${!name:-}" ]] || {
              echo "error: required android-${OBSCURA_ENV} environment value $name is missing" >&2
              exit 1
            }
          done

          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" |
            base64 --decode > android/app/google-services.json
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" |
            base64 --decode > "$RUNNER_TEMP/android-release.p12"
          chmod 600 \
            android/app/google-services.json \
            "$RUNNER_TEMP/android-release.p12"

          node <<'NODE'
          const fs = require('fs');

          const expectedPackage = process.env.ANDROID_PACKAGE_NAME;
          const config = JSON.parse(
            fs.readFileSync('android/app/google-services.json', 'utf8'),
          );
          const client = config.client?.find(
            (item) =>
              item.client_info?.android_client_info?.package_name ===
              expectedPackage,
          );

          if (!client) {
            throw new Error(
              `Firebase config does not contain Android package ${expectedPackage}`,
            );
          }
          NODE

      - name: Metadata
        id: metadata
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          [[ "$sha" == "$DISTRIBUTION_REF" ]] || {
            echo "error: checkout does not match the verified main commit" >&2
            exit 1
          }
          short_sha="$(git rev-parse --short=7 HEAD)"
          version_code="$BUILD_NUMBER"
          version_name="$RELEASE_VERSION"
          artifact_name="obscura-${OBSCURA_ENV}-android-${version_code}-${short_sha}"

          {
            echo "sha=$sha"
            echo "short_sha=$short_sha"
            echo "version_code=$version_code"
            echo "version_name=$version_name"
            echo "artifact_name=$artifact_name"
          } >> "$GITHUB_OUTPUT"

          mkdir -p dist
          {
            echo "Obscura (${OBSCURA_ENV}) Android build ${version_name} (${version_code})"
            echo
            git show -s --format='%s%n%nCommit: %H'
          } > dist/release-notes.txt

      - name: Build AAB
        env:
          ANDROID_RELEASE_STORE_FILE: ${{ runner.temp }}/android-release.p12
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD || secrets.ANDROID_RELEASE_STORE_PASSWORD }}
        run: >-
          just android-bundle
          '${{ steps.metadata.outputs.version_code }}'
          '${{ steps.metadata.outputs.version_name }}'
          '${{ env.OBSCURA_ENV }}'

      - name: Stage AAB
        id: verify
        env:
          ARTIFACT_NAME: ${{ steps.metadata.outputs.artifact_name }}
        run: |
          set -euo pipefail
          source_aab="android/app/build/outputs/bundle/${OBSCURA_ENV}Release/app-${OBSCURA_ENV}-release.aab"
          [[ -f "$source_aab" ]] || {
            echo "error: release AAB was not produced" >&2
            exit 1
          }

          mkdir -p dist
          cp "$source_aab" "dist/${ARTIFACT_NAME}.aab"

          # grep without -q reads all of jarsigner's output, so pipefail cannot
          # see a SIGPIPE when the match comes before the end.
          jarsigner -verify -verbose -certs "dist/${ARTIFACT_NAME}.aab" |
            grep "jar verified." >/dev/null
          echo "aab_sha256=$(sha256sum "dist/${ARTIFACT_NAME}.aab" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  distribute:
    name: Upload
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: android-${{ inputs.env }}
    permissions:
      contents: read
      id-token: write
    env:
      OBSCURA_ENV: ${{ inputs.env }}
      ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
      BUILD_SHA: ${{ needs.build.outputs.sha }}
      EXPECTED_REF: ${{ inputs.sha }}
      EXPECTED_SHA256: ${{ needs.build.outputs.aab_sha256 }}
      VERSION_CODE: ${{ inputs.build_number }}
      ANDROID_PACKAGE_NAME: ${{ inputs.env == 'prod' && 'dev.barrelmaker.obscura' || 'dev.barrelmaker.obscura.dev' }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Download artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist/

      - name: Verify AAB
        run: |
          set -euo pipefail
          [[ -n "$BUILD_SHA" && "$BUILD_SHA" == "$EXPECTED_REF" ]] || {
            echo "error: artifact commit does not match the tested commit" >&2
            exit 1
          }
          for name in \
            ARTIFACT_NAME \
            EXPECTED_SHA256 \
            GCP_WORKLOAD_IDENTITY_PROVIDER \
            GCP_SERVICE_ACCOUNT
          do
            [[ -n "${!name:-}" ]] || {
              echo "error: required android-${OBSCURA_ENV} environment value $name is missing" >&2
              exit 1
            }
          done
          printf '%s  %s\n' "$EXPECTED_SHA256" "dist/${ARTIFACT_NAME}.aab" |
            sha256sum --check
          [[ -s dist/release-notes.txt ]] || {
            echo "error: release notes were not included in the build artifact" >&2
            exit 1
          }

      - name: Authenticate
        id: auth
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Upload AAB
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          api="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${ANDROID_PACKAGE_NAME}"
          upload_api="https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/${ANDROID_PACKAGE_NAME}"

          edit_id="$(
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{}' \
              "${api}/edits" | jq -er '.id'
          )"

          uploaded_code="$(
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"dist/${ARTIFACT_NAME}.aab" \
              "${upload_api}/edits/${edit_id}/bundles?uploadType=media" | jq -er '.versionCode'
          )"
          [[ "$uploaded_code" == "$VERSION_CODE" ]] || {
            echo "error: uploaded versionCode ($uploaded_code) does not match expected ($VERSION_CODE)" >&2
            exit 1
          }

          notes="$(head -c 500 dist/release-notes.txt)"
          track_payload="$(jq -n \
            --arg code "$VERSION_CODE" \
            --arg notes "$notes" \
            '{
              track: "internal",
              releases: [{
                status: "completed",
                versionCodes: [$code],
                releaseNotes: [{ language: "en-US", text: $notes }]
              }]
            }'
          )"
          curl -fsSL -X PUT \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$track_payload" \
            "${api}/edits/${edit_id}/tracks/internal" >/dev/null

          curl -fsSL -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "${api}/edits/${edit_id}:commit" >/dev/null
