name: CI / iOS

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LIBSIGNAL_REF: 7ef4efdb85d8b2ebd77f3cf1e2b542a2115033c5

jobs:
  # Pull requests run a macOS job only when its inputs change. Pushes to main
  # run everything.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      swift: ${{ github.event_name != 'pull_request' || steps.filter.outputs.swift == 'true' }}
      ios: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ios == 'true' }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            shared: &shared
              - '.github/workflows/ios-ci.yml'
              - '.gitmodules'
              - 'justfile'
              - 'proto/**'
              - 'protocol/**'
              - 'swift/**'
            swift:
              - *shared
              - 'scripts/local-server.sh'
            ios:
              - *shared
              - 'ios/**'
              - '.nvmrc'
              - 'package.json'
              - 'package-lock.json'
              - 'app.json'
              - 'index.js'
              - 'babel.config.js'
              - 'metro.config.js'

  swift-unit:
    name: Swift Kit (unit tests)
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: extractions/setup-just@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)"

      - name: Resolve Swift toolchain cache key
        id: swift-toolchain
        run: echo "version=$(xcrun swift --version | shasum -a 256 | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache libsignal (source + built FFI)
        id: libsignal
        uses: actions/cache@v6
        with:
          path: swift/vendored/libsignal
          key: libsignal-${{ env.LIBSIGNAL_REF }}-host-macos26

      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: swift/.build
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-toolchain.outputs.version }}-${{ env.LIBSIGNAL_REF }}-${{ hashFiles('swift/Package.swift', 'swift/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-toolchain.outputs.version }}-${{ env.LIBSIGNAL_REF }}-${{ hashFiles('swift/Package.swift', 'swift/Package.resolved') }}-

      - uses: dtolnay/rust-toolchain@stable
        if: steps.libsignal.outputs.cache-hit != 'true'

      - name: Install protobuf when building libsignal
        if: steps.libsignal.outputs.cache-hit != 'true'
        run: brew list protobuf >/dev/null 2>&1 || brew install protobuf

      - name: Unit tests
        run: just swift-unit

  swift-integration:
    name: Swift Kit (integration, native server)
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: extractions/setup-just@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)"

      - name: Resolve Swift toolchain cache key
        id: swift-toolchain
        run: echo "version=$(xcrun swift --version | shasum -a 256 | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache libsignal (source + built FFI)
        id: libsignal
        uses: actions/cache@v6
        with:
          path: swift/vendored/libsignal
          key: libsignal-${{ env.LIBSIGNAL_REF }}-host-macos26

      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: swift/.build
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-toolchain.outputs.version }}-${{ env.LIBSIGNAL_REF }}-${{ hashFiles('swift/Package.swift', 'swift/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-toolchain.outputs.version }}-${{ env.LIBSIGNAL_REF }}-${{ hashFiles('swift/Package.swift', 'swift/Package.resolved') }}-

      - name: Resolve latest obscura-server commit
        id: server-ref
        run: echo "sha=$(scripts/local-server.sh ref)" >> "$GITHUB_OUTPUT"

      - name: Cache obscura-server binary
        id: server-bin
        uses: actions/cache@v6
        with:
          path: ~/.cache/obscura-server/bin
          key: obscura-server-${{ steps.server-ref.outputs.sha }}-macos26

      - uses: dtolnay/rust-toolchain@stable
        if: steps.libsignal.outputs.cache-hit != 'true' || steps.server-bin.outputs.cache-hit != 'true'

      - name: Install protobuf when building Rust dependencies
        if: steps.libsignal.outputs.cache-hit != 'true' || steps.server-bin.outputs.cache-hit != 'true'
        run: brew list protobuf >/dev/null 2>&1 || brew install protobuf

      # macOS runners have no Docker, so the services run as local processes.
      - name: Install backing services
        run: |
          brew install postgresql@18 minio valkey
          command -v aws >/dev/null || brew install awscli

      # Builds only on a cache miss.
      - name: Start obscura-server
        env:
          OBSCURA_SERVER_SERVICES: native
          SERVER_SHA: ${{ steps.server-ref.outputs.sha }}
        run: just server-up "$SERVER_SHA"

      - name: Integration tests
        run: just swift-integration http://localhost:3000

      - name: Server log on failure
        if: failure()
        run: just server-logs 200 || true

      - name: Stop backing services
        if: always()
        run: just server-down || true

  ios:
    name: iOS Debug Build
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    steps:
      - name: Checkout app and native dependencies
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: extractions/setup-just@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s "$(
            find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' -print |
              sort -V |
              tail -n 1
          )"

      - name: Cache libsignal source and simulator FFI
        id: libsignal
        uses: actions/cache@v6
        with:
          path: swift/vendored/libsignal
          key: libsignal-${{ env.LIBSIGNAL_REF }}-ios-sim-macos26

      - name: Install protobuf
        run: brew list protobuf >/dev/null 2>&1 || brew install protobuf

      - run: just install

      - name: Install CocoaPods
        run: sudo gem install cocoapods -v 1.17.0 -N

      - name: Build arm64 iOS app
        run: just ios-build arm64

  # The one check branch protection needs: skipped jobs pass, while a failed
  # or cancelled job (including change detection) fails the gate.
  gate:
    name: iOS CI Gate
    if: always()
    needs: [changes, swift-unit, swift-integration, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed or be skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [[ "$result" == success || "$result" == skipped ]] || exit 1
          done
