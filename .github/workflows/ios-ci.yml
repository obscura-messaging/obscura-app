name: CI / iOS

on:
  pull_request:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    name: iOS Debug Build
    runs-on: macos-26
    env:
      LIBSIGNAL_REF: 7ef4efdb85d8b2ebd77f3cf1e2b542a2115033c5
    steps:
      - name: Checkout app and native dependencies
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install just
        run: brew list just >/dev/null 2>&1 || brew install just

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s "$(
            find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' -print |
              sort -V |
              tail -n 1
          )"

      - name: Cache libsignal source and simulator FFI
        id: libsignal
        uses: actions/cache@v6
        with:
          path: obscura-native/swift/vendored/libsignal
          key: libsignal-${{ env.LIBSIGNAL_REF }}-ios-sim-macos26

      - name: Install protobuf
        run: brew list protobuf >/dev/null 2>&1 || brew install protobuf

      - run: just install

      - name: Install CocoaPods
        run: sudo gem install cocoapods -v 1.17.0 -N

      - name: Build arm64 iOS app
        run: just ios-build arm64
