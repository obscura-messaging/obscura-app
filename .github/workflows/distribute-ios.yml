name: Distribute iOS

on:
  workflow_call:
    inputs:
      env:
        required: true
        type: string
      sha:
        required: true
        type: string
      build_number:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build
    runs-on: macos-26
    timeout-minutes: 90
    environment: ios-${{ inputs.env }}
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      ipa_sha256: ${{ steps.stage.outputs.ipa_sha256 }}
      sha: ${{ steps.metadata.outputs.sha }}
    env:
      OBSCURA_ENV: ${{ inputs.env }}
      DISTRIBUTION_REF: ${{ inputs.sha }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      RELEASE_VERSION: ${{ inputs.version }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_BUNDLE_ID: ${{ inputs.env == 'prod' && 'dev.barrelmaker.obscura' || 'dev.barrelmaker.obscura.dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.DISTRIBUTION_REF }}
          submodules: recursive
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node: true

      - name: Select Xcode
        uses: ./.github/actions/xcode

      - name: Install Rust
        run: scripts/ci-install-rust.sh aarch64-apple-ios

      - name: Cache libsignal
        uses: actions/cache@v6.1.0
        with:
          path: swift/vendored/libsignal
          key: libsignal-${{ hashFiles('swift/LIBSIGNAL_REF') }}-ios-device-macos26

      - name: Install protobuf
        run: brew list protobuf >/dev/null 2>&1 || brew install protobuf

      - name: Install secrets
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          for name in IOS_DISTRIBUTION_P12_BASE64 IOS_DISTRIBUTION_PASSWORD \
                      IOS_PROVISIONING_PROFILE_BASE64 APPLE_TEAM_ID APPLE_BUNDLE_ID
          do
            [[ -n "${!name:-}" ]] || {
              echo "error: required ios-${OBSCURA_ENV} signing value $name is missing" >&2
              exit 1
            }
          done

          umask 077
          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 -D > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")"
          [[ "$bundle_id" == "${APPLE_TEAM_ID}.${APPLE_BUNDLE_ID}" ]] || {
            echo "error: distribution profile does not match the app and team" >&2
            exit 1
          }
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' \
            "$RUNNER_TEMP/profile.plist" | grep -F "group.${APPLE_BUNDLE_ID}" || {
            echo "error: distribution profile is missing the Obscura App Group (group.${APPLE_BUNDLE_ID})" >&2
            exit 1
          }
          profile_id="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          for profile_dir in \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
            "$HOME/Library/MobileDevice/Provisioning Profiles"
          do
            mkdir -p "$profile_dir"
            cp "$RUNNER_TEMP/profile.mobileprovision" "$profile_dir/$profile_id.mobileprovision"
          done

          keychain="$RUNNER_TEMP/obscura-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security import "$RUNNER_TEMP/distribution.p12" -k "$keychain" \
            -P "$IOS_DISTRIBUTION_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$keychain" |
            grep -E "Apple Distribution: .+ \(${APPLE_TEAM_ID}\)"

      - name: Metadata
        id: metadata
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          [[ "$sha" == "$DISTRIBUTION_REF" ]] || {
            echo "error: checkout does not match the tested commit" >&2
            exit 1
          }
          short_sha="$(git rev-parse --short=7 HEAD)"
          artifact_name="obscura-${OBSCURA_ENV}-ios-${BUILD_NUMBER}-${short_sha}"
          {
            echo "sha=$sha"
            echo "artifact_name=$artifact_name"
          } >> "$GITHUB_OUTPUT"
          mkdir -p dist
          {
            echo "Obscura (${OBSCURA_ENV}) iOS build ${RELEASE_VERSION} (${BUILD_NUMBER})"
            echo
            git show -s --format='%s%n%nCommit: %H'
          } > dist/release-notes.txt

      # The xcconfig and export options for the environment name the
      # provisioning profile, so archiving fails if the installed one differs.
      - name: Build IPA
        run: |
          just ios-archive "$RUNNER_TEMP/Obscura.xcarchive" "$BUILD_NUMBER" "$RELEASE_VERSION" "$OBSCURA_ENV"
          just ios-export "$RUNNER_TEMP/Obscura.xcarchive" "$RUNNER_TEMP/export" "$OBSCURA_ENV"

      - name: Stage IPA
        id: stage
        run: |
          set -euo pipefail
          ipa="$RUNNER_TEMP/export/Obscura.ipa"
          [[ -s "$ipa" ]] || {
            echo "error: signed Obscura.ipa was not exported" >&2
            exit 1
          }
          unzip -p "$ipa" Payload/Obscura.app/Info.plist > "$RUNNER_TEMP/exported-info.plist"
          bundle_id="$(plutil -extract CFBundleIdentifier raw -o - "$RUNNER_TEMP/exported-info.plist")"
          build_number="$(plutil -extract CFBundleVersion raw -o - "$RUNNER_TEMP/exported-info.plist")"
          version="$(plutil -extract CFBundleShortVersionString raw -o - "$RUNNER_TEMP/exported-info.plist")"
          [[ "$bundle_id" == "$APPLE_BUNDLE_ID" && "$build_number" == "$BUILD_NUMBER" &&
             "$version" == "$RELEASE_VERSION" ]] || {
            echo "error: exported IPA has the wrong bundle ID or release version" >&2
            exit 1
          }
          [[ -d "$RUNNER_TEMP/Obscura.xcarchive/dSYMs" ]] || {
            echo "error: archive is missing debug symbols" >&2
            exit 1
          }
          cp "$ipa" dist/Obscura.ipa
          echo "ipa_sha256=$(shasum -a 256 dist/Obscura.ipa | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/Obscura.xcarchive/dSYMs" dist/Obscura.dSYMs.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  distribute:
    name: Upload
    needs: build
    runs-on: macos-26
    timeout-minutes: 45
    environment: ios-${{ inputs.env }}
    env:
      BUILD_SHA: ${{ needs.build.outputs.sha }}
      EXPECTED_REF: ${{ inputs.sha }}
      EXPECTED_SHA256: ${{ needs.build.outputs.ipa_sha256 }}
      APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Select Xcode
        uses: ./.github/actions/xcode

      - name: Download artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist/

      - name: Verify IPA
        run: |
          set -euo pipefail
          [[ -n "$BUILD_SHA" && "$BUILD_SHA" == "$EXPECTED_REF" ]] || {
            echo "error: IPA does not match the tested commit" >&2
            exit 1
          }
          [[ -n "$EXPECTED_SHA256" ]] || {
            echo "error: missing IPA checksum" >&2
            exit 1
          }
          printf '%s  %s\n' "$EXPECTED_SHA256" dist/Obscura.ipa | shasum -a 256 --check

      - name: Upload IPA
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          set -euo pipefail
          for name in APP_STORE_CONNECT_API_KEY_P8 APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID
          do
            [[ -n "${!name:-}" ]] || {
              echo "error: required App Store Connect value $name is missing" >&2
              exit 1
            }
          done
          umask 077
          key_file="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" > "$key_file"
          xcrun altool --upload-app -f dist/Obscura.ipa --platform ios \
            --api-key "$APP_STORE_CONNECT_KEY_ID" \
            --api-issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --p8-file-path "$key_file"
