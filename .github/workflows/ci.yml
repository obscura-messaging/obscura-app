name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Pull requests run a native job only when its inputs change. Pushes to main
  # run everything, because a release requires a fully green main commit.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      kotlin: ${{ github.event_name != 'pull_request' || steps.filter.outputs.kotlin == 'true' }}
      android: ${{ github.event_name != 'pull_request' || steps.filter.outputs.android == 'true' }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            shared: &shared
              - '.github/workflows/ci.yml'
              - '.gitmodules'
              - 'justfile'
              - 'proto/**'
              - 'protocol/**'
            kotlin:
              - *shared
              - 'kotlin/**'
              - 'scripts/run-with-java-21.sh'
              - 'scripts/local-server.sh'
            android:
              - *shared
              - 'android/**'
              - 'kotlin/**'
              - 'scripts/run-with-android-env.sh'
              - 'scripts/run-with-java-21.sh'
              - '.java-version'
              - '.nvmrc'
              - 'package.json'
              - 'package-lock.json'
              - 'app.json'
              - 'index.js'
              - 'babel.config.js'
              - 'metro.config.js'

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: extractions/setup-just@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: just install
      # Domain, bridge-facade, and state tests run without a native simulator.
      # ESLint errors fail the job; warnings remain non-fatal.
      - run: just check

  kotlin-unit:
    name: Kotlin Kit (unit tests + coverage)
    needs: changes
    if: needs.changes.outputs.kotlin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: extractions/setup-just@v4

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6.4.1

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint client protocol
        run: just protocol-lint

      - name: Validate client protocol vectors and run Kotlin unit tests + coverage
        run: just kotlin-check

      - name: Upload unit-test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kotlin-unit-test-report
          path: kotlin/lib/build/reports/tests/test/
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kotlin-coverage-report
          path: |
            kotlin/lib/build/reports/kover/html/
            kotlin/lib/build/reports/kover/report.xml
          retention-days: 14

  kotlin-integration:
    name: Kotlin Kit (integration, native server)
    needs: changes
    if: needs.changes.outputs.kotlin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: extractions/setup-just@v4

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6.4.1

      - name: Resolve latest obscura-server commit
        id: server-ref
        run: echo "sha=$(scripts/local-server.sh ref)" >> "$GITHUB_OUTPUT"

      - name: Cache obscura-server binary
        id: server-bin
        uses: actions/cache@v6
        with:
          path: ~/.cache/obscura-server/bin
          key: obscura-server-${{ steps.server-ref.outputs.sha }}-ubuntu

      - uses: dtolnay/rust-toolchain@stable
        if: steps.server-bin.outputs.cache-hit != 'true'

      - name: Install protobuf when building Rust dependencies
        if: steps.server-bin.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # Builds only on a cache miss; backing services come from the server's
      # docker-compose.yml.
      - name: Start obscura-server
        env:
          SERVER_SHA: ${{ steps.server-ref.outputs.sha }}
        run: just server-up "$SERVER_SHA"

      - name: Integration tests
        run: just kotlin-integration http://localhost:3000

      - name: Server log on failure
        if: failure()
        run: just server-logs 200 || true

      - name: Upload integration-test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kotlin-integration-test-report
          path: kotlin/lib/build/reports/tests/integrationTest/
          retention-days: 14

  android:
    name: Android Release Build
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@v7
        with:
          # The proto submodule is required by Kotlin protobuf codegen.
          submodules: recursive

      - uses: extractions/setup-just@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6.4.1

      - run: just install

      # Main builds a signed bundle once in the separate release workflow.
      - name: Compile arm64 release APK
        run: just android-apk arm64-v8a false

  # The one check branch protection needs: skipped jobs pass, while a failed
  # or cancelled job (including change detection) fails the gate.
  gate:
    name: CI Gate
    if: always()
    needs: [changes, javascript, kotlin-unit, kotlin-integration, android]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed or be skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [[ "$result" == success || "$result" == skipped ]] || exit 1
          done
