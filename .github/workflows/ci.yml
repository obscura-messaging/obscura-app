name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Pull requests run a native job only when its inputs change. Pushes to main
  # run everything, because a release requires a fully green main commit.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      core: ${{ github.event_name != 'pull_request' || steps.filter.outputs.core == 'true' }}
      android: ${{ github.event_name != 'pull_request' || steps.filter.outputs.android == 'true' }}
      ios: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ios == 'true' }}
    steps:
      - name: Filter paths
        uses: dorny/paths-filter@v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            shared: &shared
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
              - '.gitmodules'
              - 'justfile'
              - 'server-proto/**'
              - 'client-protocol/**'
            app: &app
              - '.nvmrc'
              - 'package.json'
              - 'package-lock.json'
              - 'app.json'
              - 'index.js'
              - 'babel.config.js'
              - 'metro.config.js'
            core:
              - *shared
              - 'core/**'
              - 'scripts/ci-install-rust.sh'
              - '.java-version'
              - 'android/gradlew'
              - 'android/gradle/**'
            android:
              - *shared
              - *app
              - 'android/**'
              - 'core/**'
              - 'scripts/ci-install-rust.sh'
              - '.java-version'
            ios:
              - *shared
              - '.xcode-version'
              - *app
              - 'ios/**'
              - 'core/**'
              - 'scripts/ci-install-rust.sh'
              - 'scripts/simulator.sh'

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node: true

      # Domain, bridge-facade, and state tests run without a native simulator.
      # ESLint errors fail the job; warnings remain non-fatal.
      - name: Check
        run: just check

      - name: Release script
        run: just release-script-test

      # PRs that touch only JavaScript skip the native builds, which bundle it.
      - name: Bundle
        run: just bundle

  core:
    name: Core
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Setup
        uses: ./.github/actions/setup
        with:
          java: true
          rust: true

      - name: Install buf
        uses: bufbuild/buf-action@v1.7.0
        with:
          setup_only: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint protocol
        run: just protocol-lint

      - name: Rust core check
        run: just core-check

      - name: Kotlin JVM binding tests
        run: just core-jvm-test

  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node: true
          java: true
          rust: true
          rust-targets: aarch64-linux-android
          cargo-ndk: true

      - name: Build app
        run: just android-build arm64-v8a false

  ios:
    name: iOS
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node: true
          rust: true
          rust-targets: aarch64-apple-ios-sim

      - name: Select Xcode
        uses: ./.github/actions/xcode

      - name: Install CocoaPods
        run: sudo gem install cocoapods -v 1.17.0 -N

      - name: Swift XCFramework and binding tests
        run: just core-swift-test

      - name: Build app
        run: just ios-build arm64

  # The one check branch protection needs: skipped jobs pass, while a failed
  # or cancelled job (including change detection) fails the gate.
  gate:
    name: Gate
    if: always()
    needs: [changes, javascript, core, android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [[ "$result" == success || "$result" == skipped ]] || exit 1
          done
