name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Pull requests run a native job only when its inputs change. Pushes to main
  # run everything, because a release requires a fully green main commit.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      kotlin: ${{ github.event_name != 'pull_request' || steps.filter.outputs.kotlin == 'true' }}
      android: ${{ github.event_name != 'pull_request' || steps.filter.outputs.android == 'true' }}
      swift: ${{ github.event_name != 'pull_request' || steps.filter.outputs.swift == 'true' }}
      ios: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ios == 'true' }}
    steps:
      - name: Filter paths
        uses: dorny/paths-filter@v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            shared: &shared
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
              - '.gitmodules'
              - 'justfile'
              - 'proto/**'
              - 'protocol/**'
            app: &app
              - '.nvmrc'
              - 'package.json'
              - 'package-lock.json'
              - 'app.json'
              - 'index.js'
              - 'babel.config.js'
              - 'metro.config.js'
            kotlin:
              - *shared
              - 'kotlin/**'
              - 'scripts/ci-install-rust.sh'
              - 'scripts/local-server.sh'
            android:
              - *shared
              - *app
              - 'android/**'
              - 'kotlin/**'
              - '.java-version'
            swift:
              - *shared
              - '.xcode-version'
              - 'swift/**'
              - 'scripts/ci-install-rust.sh'
              - 'scripts/local-server.sh'
            ios:
              - *shared
              - '.xcode-version'
              - *app
              - 'ios/**'
              - 'swift/**'

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node: true

      # Domain, bridge-facade, and state tests run without a native simulator.
      # ESLint errors fail the job; warnings remain non-fatal.
      - name: Check
        run: just check

      - name: Release script
        run: just release-script-test

      # PRs that touch only JavaScript skip the native builds, which bundle it.
      - name: Bundle
        run: just bundle

  kotlin:
    name: Kotlin
    needs: changes
    if: needs.changes.outputs.kotlin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Setup
        uses: ./.github/actions/setup
        with:
          java: true

      - name: Install buf
        uses: bufbuild/buf-action@v1.7.0
        with:
          setup_only: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint protocol
        run: just protocol-lint

      - name: Unit tests
        run: just kotlin-check

      - name: Resolve server
        id: server-ref
        run: echo "sha=$(scripts/local-server.sh ref)" >> "$GITHUB_OUTPUT"

      - name: Cache server
        id: server-bin
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/obscura-server/bin
          key: obscura-server-${{ steps.server-ref.outputs.sha }}-ubuntu

      - name: Install Rust
        if: steps.server-bin.outputs.cache-hit != 'true'
        run: scripts/ci-install-rust.sh

      - name: Install protobuf
        if: steps.server-bin.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # Builds only on a cache miss; backing services come from the server's
      # docker-compose.yml.
      - name: Start server
        env:
          SERVER_SHA: ${{ steps.server-ref.outputs.sha }}
        run: just server-up "$SERVER_SHA"

      - name: Integration tests
        run: just kotlin-integration http://localhost:3000

      - name: Server log
        if: failure()
        run: just server-logs 200 || true

      # The full log, since a failure early in a long suite falls outside the tail above.
      - name: Server log artifact
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kotlin-server-log
          path: ~/.cache/obscura-server/run/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kotlin-test-report
          path: kotlin/lib/build/reports/tests/
          retention-days: 14

      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kotlin-coverage-report
          path: |
            kotlin/lib/build/reports/kover/html/
            kotlin/lib/build/reports/kover/report.xml
          retention-days: 14

  android:
    name: Android
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # The proto submodule is required by Kotlin protobuf codegen.
          submodules: recursive

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node: true
          java: true

      # Main builds a signed bundle once in the separate release workflow.
      - name: Build app
        run: just android-build arm64-v8a false

  swift:
    name: Swift
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Setup
        uses: ./.github/actions/setup

      - name: Select Xcode
        uses: ./.github/actions/xcode

      # The package's dependencies, including libsignal's prebuilt XCFramework,
      # and protoc-gen-swift built at the pinned SwiftProtobuf version.
      - name: Cache SwiftPM
        uses: actions/cache@v6.1.0
        with:
          path: |
            swift/.build/DerivedData/SourcePackages
            swift/.build/tools
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.xcode-version', 'swift/Package.swift', 'swift/Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-

      # The protobuf bindings are generated, and the server build needs it too.
      - name: Install protobuf
        run: brew list protobuf >/dev/null 2>&1 || brew install protobuf

      - name: Resolve server
        id: server-ref
        run: echo "sha=$(scripts/local-server.sh ref)" >> "$GITHUB_OUTPUT"

      - name: Cache server
        id: server-bin
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/obscura-server/bin
          key: obscura-server-${{ steps.server-ref.outputs.sha }}-macos26

      - name: Install Rust
        if: steps.server-bin.outputs.cache-hit != 'true'
        run: scripts/ci-install-rust.sh

      - name: Unit tests
        run: just swift-unit

      # macOS runners have no Docker, so the services run as local processes.
      - name: Install services
        run: |
          brew install postgresql@18 minio valkey
          command -v aws >/dev/null || brew install awscli

      # Builds only on a cache miss.
      - name: Start server
        env:
          OBSCURA_SERVER_SERVICES: native
          SERVER_SHA: ${{ steps.server-ref.outputs.sha }}
        run: just server-up "$SERVER_SHA"

      - name: Integration tests
        run: just swift-integration http://localhost:3000

      - name: Server log
        if: failure()
        run: just server-logs 200 || true

      # The full log, since a failure early in a long suite falls outside the tail above.
      - name: Server log artifact
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: swift-server-log
          path: ~/.cache/obscura-server/run/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop server
        if: always()
        run: just server-down || true

      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: swift-test-report
          path: swift/.build/reports/*-tests.log
          retention-days: 14

      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: swift-coverage-report
          path: |
            swift/.build/reports/coverage.txt
            swift/.build/reports/coverage.json
          retention-days: 14

  ios:
    name: iOS
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node: true

      - name: Select Xcode
        uses: ./.github/actions/xcode

      # The kit's protobuf bindings are generated before the build.
      - name: Install protobuf
        run: brew list protobuf >/dev/null 2>&1 || brew install protobuf

      - name: Install CocoaPods
        run: sudo gem install cocoapods -v 1.17.0 -N

      - name: Build app
        run: just ios-build arm64

  # The one check branch protection needs: skipped jobs pass, while a failed
  # or cancelled job (including change detection) fails the gate.
  gate:
    name: Gate
    if: always()
    needs: [changes, javascript, kotlin, android, swift, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [[ "$result" == success || "$result" == skipped ]] || exit 1
          done
