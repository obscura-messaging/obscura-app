buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.5.0")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // libsignal releases after 0.86.5 are only in Signal's repository
        // (see ../kotlin/settings.gradle.kts).
        exclusiveContent {
            forRepository { maven { name = "signal"; url = "https://build-artifacts.signal.org/libraries/maven/" } }
            filter { includeGroup("org.signal") }
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
