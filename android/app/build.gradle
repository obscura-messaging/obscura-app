apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

// Release signing — credentials live in android/keystore.properties (gitignored).
// If the file is absent (fresh clone / CI without secrets), release falls back to debug
// signing so the project still builds.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def signingValue = { String propertyName, String environmentName ->
    System.getenv(environmentName) ?: keystoreProperties[propertyName]
}
def releaseStoreFilePath = signingValue("storeFile", "ANDROID_RELEASE_STORE_FILE")
def releaseStorePassword = signingValue("storePassword", "ANDROID_RELEASE_STORE_PASSWORD")
def releaseKeyAlias = signingValue("keyAlias", "ANDROID_RELEASE_KEY_ALIAS")
def releaseKeyPassword = signingValue("keyPassword", "ANDROID_RELEASE_KEY_PASSWORD") ?: releaseStorePassword
def releaseStoreFile = releaseStoreFilePath ? file(releaseStoreFilePath) : null
def releaseSigningConfigured =
    releaseStoreFile?.isFile() &&
    releaseStorePassword &&
    releaseKeyAlias &&
    releaseKeyPassword

def signedBundleBuild =
    (findProperty("obscuraSignedBundle") ?: "false").toBoolean()
def packageJsonVersion = new groovy.json.JsonSlurper().parse(file("../../package.json")).version.toString()
def obscuraVersionCode =
    (findProperty("obscuraVersionCode") ?: "1").toString().toInteger()
def obscuraVersionName =
    (findProperty("obscuraVersionName") ?: packageJsonVersion).toString()

if (obscuraVersionCode <= 0) {
    throw new GradleException("obscuraVersionCode must be a positive integer")
}
if (obscuraVersionName.trim().isEmpty()) {
    throw new GradleException("obscuraVersionName must not be empty")
}
if (signedBundleBuild) {
    if (!releaseSigningConfigured) {
        throw new GradleException(
            "Signed bundle builds require a readable release keystore and all signing credentials"
        )
    }
    if (!hasProperty("obscuraVersionCode") || !hasProperty("obscuraVersionName")) {
        throw new GradleException(
            "Signed bundle builds require obscuraVersionCode and obscuraVersionName"
        )
    }

    def firebaseConfig = file("google-services.json")
    def firebaseStub = file("google-services.stub.json")
    if (!firebaseConfig.isFile()) {
        throw new GradleException("Signed bundle builds require android/app/google-services.json")
    }
    if (firebaseStub.isFile() && firebaseConfig.bytes == firebaseStub.bytes) {
        throw new GradleException(
            "Signed bundle builds require the real Firebase config, not google-services.stub.json"
        )
    }
}

react {
    // The dev/prod product flavors make every debug variant flavor-qualified,
    // so the default "debug" and "debugOptimized" would match none of them.
    debuggableVariants = ["devDebug", "devDebugOptimized", "prodDebug", "prodDebugOptimized"]
    autolinkLibrariesWithApp()
}

// R8 + resource shrinking are on for release. Keep rules live in proguard-rules.pro.
def enableProguardInReleaseBuilds =
    (findProperty("enableProguardInReleaseBuilds") ?: "true").toBoolean()
def targetArchitectures =
    (findProperty("reactNativeArchitectures") ?: "armeabi-v7a,arm64-v8a,x86,x86_64").split(",")

// JSC is intentionally unused — Hermes is enabled in gradle.properties.

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "dev.barrelmaker.obscura"
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "dev.barrelmaker.obscura"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode obscuraVersionCode
        versionName obscuraVersionName
    }

    // Each environment is a separate app with its own server, so dev and prod
    // installs can sit side by side on one device.
    flavorDimensions "env"
    productFlavors {
        dev {
            dimension "env"
            applicationIdSuffix ".dev"
            resValue "string", "app_name", "Obscura Dev"
            buildConfigField "String", "OBSCURA_API_URL", '"https://devscura.barrelmaker.dev"'
        }
        prod {
            dimension "env"
            resValue "string", "app_name", "Obscura"
            buildConfigField "String", "OBSCURA_API_URL", '"https://obscura.barrelmaker.dev"'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        // The libsignal-client JVM artifact bundles native libs for every desktop OS
        // (macOS .dylib, Windows .dll, Linux/server .so) plus a `_testing` JNI variant
        // we never call into. Strip them — they're ~90 MB of dead weight in the APK.
        jniLibs {
            excludes += [
                "**/libsignal_jni_testing.so",
            ]
        }
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
            excludes += "/META-INF/DEPENDENCIES"
            excludes += [
                "**/*.dylib",
                "**/*.dll",
                "**/*.pdb",
                // .so files inside JAR roots (libsignal-client ships server-side natives
                // at the JAR root, not under jni/; the Android JNI libs come from the
                // libsignal-android AAR and aren't matched by this glob).
                "*.so",
            ]
        }
    }
    // Per-ABI APKs cut sideload size ~4x. Disable ABI splits when building an AAB bundle.
    splits {
        abi {
            enable !gradle.startParameter.taskNames.any { it.toLowerCase().contains("bundle") }
            reset()
            include(*targetArchitectures)
            universalApk targetArchitectures.size() > 1
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (releaseSigningConfigured) {
                storeFile releaseStoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Signed with the real upload key when keystore.properties is present
            // or the equivalent environment variables are set. Compile-only
            // builds fall back to debug signing; distribution builds fail above.
            signingConfig releaseSigningConfigured ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    }
    // JSC fallback intentionally omitted — Hermes is on (gradle.properties).

    // ObscuraKit — E2E encrypted data layer, built from ../kotlin (settings.gradle)
    implementation("dev.barrelmaker.obscura.kit:obscura-kit")

    // Android SQLDelight driver (replaces JVM driver from ObscuraKit)
    implementation("app.cash.sqldelight:android-driver:2.0.2")
    implementation("app.cash.sqldelight:coroutines-extensions:2.0.2")
    // Database encryption at rest (SQLCipher), keyed from the Android Keystore.
    implementation("net.zetetic:sqlcipher-android:4.20.0@aar")
    implementation("androidx.sqlite:sqlite:2.7.1")

    // libsignal Android native (replaces JVM variant from ObscuraKit)
    implementation("org.signal:libsignal-android:0.72.0")

    // Coroutines
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0")

    // Lifecycle (foreground reconnect)
    implementation("androidx.lifecycle:lifecycle-process:2.10.0")

    // Firebase Cloud Messaging — silent push wake-up bell. NEVER carries content.
    // Privacy invariant: notification text is hardcoded generic ("New pix" / "New message").
    implementation(platform("com.google.firebase:firebase-bom:35.1.0"))
    implementation("com.google.firebase:firebase-messaging")

    // Desugaring (required by libsignal-android)
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
